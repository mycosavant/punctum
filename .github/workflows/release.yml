# On a version tag (v0.1.0), builds punctumd and everywhere with native/release-build, the
# same script anyone can run to rebuild it and compare, and attaches the
# binaries and their .sha256 files to a draft release. Nothing is published
# until a maintainer reviews the draft, publishes it, and commits the
# checksums to native/checksums.txt, which is what bin/punctum-native checks
# a download against.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  punctumd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Build
        run: native/release-build dist
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="punctumd and everywhere binaries for $TAG, built by native/release-build with:
          $(cat dist/built-with.txt)
          To check one, rebuild it from this tag with that script and the same compilers, and compare the SHA-256."
          gh release create "$TAG" dist/* --draft --verify-tag --title "Punctum $TAG" --notes "$notes"
