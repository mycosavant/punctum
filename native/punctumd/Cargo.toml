[package]
name = "punctumd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native extensions for Punctum, the command bar for Linux"
repository = "https://github.com/mycosavant/punctum"
publish = false

[dependencies]
idna = "1.1.0"
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
psl = "2.1.241"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
