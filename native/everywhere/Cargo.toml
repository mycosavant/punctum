[package]
name = "everywhere"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Find files anywhere on the disk by name, as you type"
repository = "https://github.com/mycosavant/punctum"
publish = false

[[bin]]
name = "everywhere"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
jiff = "0.2"
nucleo-matcher = "0.3"
regex = "1"
serde_json = "1"
